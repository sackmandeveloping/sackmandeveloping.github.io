<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10091d">
  <meta name="description" content="Futbol Quiz — Hemen indir!">
  <title>Futbol Quiz</title>
  <style>
    :root { color-scheme: dark; --purple:#a855f7; --yellow:#ffe083; }
    * { box-sizing:border-box }
    body {
      margin:0; min-height:100svh; display:grid; place-items:center; padding:26px 20px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      color:#fff; background:radial-gradient(ellipse at 50% 0%,#392052 0%,#1a1028 44%,#09070e 100%);
    }
    main { width:min(100%,420px); text-align:center }
    .logo {
      display:block; width:132px; height:132px; object-fit:cover; margin:0 auto 22px;
      border-radius:29px; box-shadow:0 12px 42px #0009,0 0 25px #a855f766;
      border:1px solid #ffffff40;
    }
    .eyebrow { color:var(--yellow); font-size:11px; letter-spacing:.22em; font-weight:850; text-transform:uppercase }
    h1 { font-size:clamp(34px,9vw,43px); line-height:1; margin:10px 0 12px; letter-spacing:-.045em; font-weight:900 }
    h1 span { color:var(--yellow) }
    p { color:#c9bfd5; line-height:1.55; margin:0 auto 26px; max-width:320px; font-size:15px }
    .panel {
      padding:14px; border-radius:24px; background:#ffffff0b;
      border:1px solid #ffffff20; box-shadow:0 20px 60px #0006; backdrop-filter:blur(12px);
    }
    a.store {
      display:flex; align-items:center; gap:15px; width:100%; min-height:78px; padding:13px 17px;
      margin:9px 0; border-radius:17px; text-decoration:none; color:#fff; text-align:left;
      background:#09080d; border:1px solid #a855f7aa;
      box-shadow:inset 0 0 18px #a855f71c,0 0 18px #a855f722;
      transition:transform .16s ease,background .16s ease;
    }
    a.store:active { transform:scale(.975) }
    a.store.recommended { border:2px solid var(--yellow); background:#21142c }
    .store-icon { width:42px; height:42px; flex:0 0 42px; display:grid; place-items:center }
    .store-icon svg { width:38px; height:38px; display:block }
    .store-copy { display:flex; flex-direction:column; gap:3px }
    .small { font-size:12px; color:#c7bdce }
    .big { font-size:17px; font-weight:800 }
    .tag { margin-left:auto; font-size:9px; color:#17101f; background:var(--yellow); padding:6px 8px; border-radius:20px; font-weight:900; white-space:nowrap }
    .foot { margin-top:19px; font-size:11px; color:#92869e }
    @media (prefers-reduced-motion:reduce) { a.store { transition:none } }
  </style>
</head>
